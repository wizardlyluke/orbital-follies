<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbital Follies</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; } /* Prevent scrollbars */
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 10px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            border-radius: 5px;
            pointer-events: none; /* Allow clicks to pass through */
            z-index: 100;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 100;
        }
        #timeSlider {
            width: 300px;
            margin: 10px 0;
        }
        .slider-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        .slider-label {
            margin: 0 10px;
            font-size: 14px;
        }
        .control-button {
            background-color: #c62828;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-family: Arial, sans-serif;
            font-weight: bold;
            transition: all 0.3s;
        }
        .control-button:hover {
            background-color: #e53935;
            transform: scale(1.05);
        }
        .control-button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div id="info">
        Orbital Follies<br>
        WASD/Arrow Keys: Move Camera | Mouse: Orbit | Scroll: Zoom
    </div>
    <div id="controls">
        <div>Time Scale Control</div>
        <div class="slider-container">
            <span class="slider-label">Slow</span>
            <input type="range" id="timeSlider" min="0" max="100" value="10" step="1">
            <span class="slider-label">Fast</span>
        </div>
        <div id="timeValue">Current: 0.1</div>
        <div id="asteroid-button-container" style="margin-top: 15px;">
            <button id="launchAsteroid" class="control-button">Launch Doomsday Asteroid</button>
        </div>
    </div>
    <!-- Three.js library -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
            }
        }
    </script>

    <!-- Application script -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Approximate data (scaled for visualization)
        // Units: Radius (arbitrary), Distance (arbitrary), Period (relative to Earth year)
        const celestialBodiesData = {
            sun: { name: 'Sun', radius: 5, color: 0xFFFF00 /* texture: 'textures/sun.jpg' */ },
            mercury: { name: 'Mercury', radius: 0.4, distance: 10, period: 0.24, color: 0x8C8C8C /* texture: 'textures/mercury.jpg' */ },
            venus: { name: 'Venus', radius: 0.9, distance: 15, period: 0.62, color: 0xE6E6FA /* texture: 'textures/venus.jpg' */ },
            earth: {
                name: 'Earth', radius: 1, distance: 20, period: 1, color: 0x4682B4 /* texture: 'textures/earth.jpg' */,
                moons: [
                    { name: 'Moon', radius: 0.27, distance: 2, period: 0.074, color: 0xD3D3D3 /* texture: 'textures/moon.jpg' */ }
                ]
            },
            mars: {
                name: 'Mars', radius: 0.5, distance: 28, period: 1.88, color: 0xFF4500 /* texture: 'textures/mars.jpg' */,
                moons: [
                    { name: 'Phobos', radius: 0.01, distance: 1, period: 0.002, color: 0x808080 },
                    { name: 'Deimos', radius: 0.006, distance: 1.5, period: 0.003, color: 0x808080 }
                ]
            },
            jupiter: {
                name: 'Jupiter', radius: 3.5, distance: 45, period: 11.86, color: 0xFFD700 /* texture: 'textures/jupiter.jpg' */,
                moons: [
                    { name: 'Io', radius: 0.36, distance: 5, period: 0.004, color: 0xFFFFE0 },
                    { name: 'Europa', radius: 0.31, distance: 6, period: 0.009, color: 0xF5F5DC },
                    { name: 'Ganymede', radius: 0.52, distance: 7.5, period: 0.019, color: 0xA0522D },
                    { name: 'Callisto', radius: 0.48, distance: 9, period: 0.045, color: 0x696969 }
                ]
            },
            saturn: {
                name: 'Saturn', radius: 3, distance: 65, period: 29.46, color: 0xF0E68C /* texture: 'textures/saturn.jpg' */,
                moons: [
                    { name: 'Titan', radius: 0.51, distance: 5, period: 0.043, color: 0xFFA500 }
                    // Add other major moons if desired (Rhea, Iapetus, Dione, Tethys)
                ],
                rings: { innerRadius: 3.5, outerRadius: 6, color: 0xAAAAAA /* texture: 'textures/saturn_ring.png' */ }
            },
            uranus: {
                name: 'Uranus', radius: 2, distance: 85, period: 84.01, color: 0xAFEEEE /* texture: 'textures/uranus.jpg' */,
                moons: [
                    { name: 'Titania', radius: 0.15, distance: 3, period: 0.023, color: 0xD3D3D3 }
                    // Add other major moons if desired (Oberon, Umbriel, Ariel, Miranda)
                ],
                 rings: { innerRadius: 2.5, outerRadius: 3, color: 0x999999 } // Simplified rings
            },
            neptune: {
                name: 'Neptune', radius: 1.9, distance: 100, period: 164.8, color: 0x4169E1 /* texture: 'textures/neptune.jpg' */,
                moons: [
                    { name: 'Triton', radius: 0.27, distance: 3.5, period: 0.016, color: 0xFFE4B5 }
                ]
            },
            pluto: { name: 'Pluto', radius: 0.18, distance: 115, period: 248, color: 0xF5DEB3 /* texture: 'textures/pluto.jpg' */,
                moons: [
                     { name: 'Charon', radius: 0.09, distance: 0.8, period: 0.017, color: 0x8B4513 }
                ]
             }
        };

        // Scaling factor for time to make orbits visible
        let timeScale = 0.1; // Adjust this to speed up/slow down simulation

        // 1. Scene
        const scene = new THREE.Scene();

        // --- Lighting ---
        // Ambient light to softly illuminate the scene
        const ambientLight = new THREE.AmbientLight(0x404040, 1.5); // Increased intensity slightly
        scene.add(ambientLight);

        // Point light originating from the Sun
        const pointLight = new THREE.PointLight(0xFFFFFF, 500, 500); // color, intensity, distance. Increased intensity significantly
        // Since the sun mesh is at (0,0,0), the light should also be there
        scene.add(pointLight);

        // --- Starfield Background ---
        function createStarfield(count = 10000) {
            const vertices = [];
            for (let i = 0; i < count; i++) {
                // Create stars in a large sphere around the scene
                const radius = 800;
                const theta = 2 * Math.PI * Math.random();
                const phi = Math.acos(2 * Math.random() - 1);
                
                const x = radius * Math.sin(phi) * Math.cos(theta);
                const y = radius * Math.sin(phi) * Math.sin(theta);
                const z = radius * Math.cos(phi);
                
                vertices.push(x, y, z);
            }
            
            const starGeometry = new THREE.BufferGeometry();
            starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            
            const starMaterial = new THREE.PointsMaterial({
                color: 0xFFFFFF,
                size: 0.7,
                sizeAttenuation: true
            });
            
            const starfield = new THREE.Points(starGeometry, starMaterial);
            return starfield;
        }
        
        // Add starfield to scene
        scene.add(createStarfield());

        // --- Create Galaxies for Background ---
        function createGalaxy(params = {}) {
            // Generate more vibrant base colors
            const getRandomColor = () => {
                // Random vibrant color
                const hue = Math.random() * 360;
                const saturation = 0.7 + Math.random() * 0.3; // 70-100% saturation for vibrance
                const lightness = 0.5 + Math.random() * 0.3; // 50-80% lightness for brightness
                return new THREE.Color().setHSL(hue/360, saturation, lightness);
            };

            const options = {
                position: new THREE.Vector3(
                    (Math.random() - 0.5) * 1500,
                    (Math.random() - 0.5) * 1500,
                    (Math.random() - 0.5) * 1500
                ),
                size: 80 + Math.random() * 150, // Bigger galaxies
                particles: 8000 + Math.random() * 7000, // More particles
                branches: 2 + Math.floor(Math.random() * 5), // Random number of arms (2-6)
                spin: 0.5 + Math.random() * 1.5, // Random spin factor
                randomness: 0.1 + Math.random() * 0.2, // Random deviation from perfect spiral
                randomnessPower: 2 + Math.random() * 2, // How much randomness increases toward edges
                insideColor: getRandomColor(),
                outsideColor: getRandomColor(),
                ...params
            };
            
            // Create galaxy geometry
            const particles = Math.floor(options.particles);
            const positions = new Float32Array(particles * 3);
            const colors = new Float32Array(particles * 3);
            const sizes = new Float32Array(particles);
            
            for (let i = 0; i < particles; i++) {
                // Position calculation
                const radius = Math.random() * options.size;
                const spinAngle = radius * options.spin;
                const branchAngle = (i % options.branches) * Math.PI * 2 / options.branches;
                
                // Add randomness to position
                const randomX = Math.pow(Math.random(), options.randomnessPower) * (Math.random() < 0.5 ? 1 : -1) * options.randomness * radius;
                const randomY = Math.pow(Math.random(), options.randomnessPower) * (Math.random() < 0.5 ? 1 : -1) * options.randomness * radius;
                const randomZ = Math.pow(Math.random(), options.randomnessPower) * (Math.random() < 0.5 ? 1 : -1) * options.randomness * radius;
                
                // Calculate position on spiral arm
                const x = Math.cos(branchAngle + spinAngle) * radius + randomX;
                const y = randomY; // Flat galaxy with some thickness from randomness
                const z = Math.sin(branchAngle + spinAngle) * radius + randomZ;
                
                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;
                
                // Color gradient from inside to outside
                const mixedColor = options.insideColor.clone();
                mixedColor.lerp(options.outsideColor, radius / options.size);
                
                colors[i * 3] = mixedColor.r;
                colors[i * 3 + 1] = mixedColor.g;
                colors[i * 3 + 2] = mixedColor.b;
                
                // Varying particle sizes (smaller near center, larger on edges)
                sizes[i] = (0.2 + Math.random() * 0.8) * (0.5 + radius / options.size * 0.5);
            }
            
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            
            // Using a custom shader material for more control over particle rendering
            const material = new THREE.PointsMaterial({
                size: 0.7,
                sizeAttenuation: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending,
                vertexColors: true,
                transparent: true
            });
            
            const galaxy = new THREE.Points(geometry, material);
            galaxy.position.copy(options.position);
            
            // Add random rotation to the entire galaxy
            galaxy.rotation.x = Math.random() * Math.PI;
            galaxy.rotation.y = Math.random() * Math.PI;
            galaxy.rotation.z = Math.random() * Math.PI;
            
            return galaxy;
        }
        
        // Add several galaxies with varying properties to the scene
        for (let i = 0; i < 8; i++) { // Increase number of galaxies from 5 to 8
            scene.add(createGalaxy());
        }

        // 2. Camera
        const camera = new THREE.PerspectiveCamera(
            75, // Field of view
            window.innerWidth / window.innerHeight, // Aspect ratio
            0.1, // Near clipping plane
            1000 // Far clipping plane
        );
        camera.position.set(0, 75, 120); // Position camera to see more of the system

        // 3. Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight); // Set size to window size
        document.body.appendChild(renderer.domElement); // Add canvas to the DOM

        // --- Controls ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; // Optional: adds inertia to camera movement
        controls.dampingFactor = 0.05;
        controls.screenSpacePanning = false; // Optional: restrict panning to horizontal plane
        controls.minDistance = 5;   // Optional: prevent zooming too close
        controls.maxDistance = 500; // Optional: prevent zooming too far
        controls.target.set(0, 0, 0); // Ensure controls focus on the center (sun)
        controls.update(); // Initialize controls state

// Updated Helper function to create celestial body mesh with Standard Material
function createCelestialBody(data) {
    const geometry = new THREE.SphereGeometry(data.radius, 32, 32);
    let material;
    if (data.name === 'Sun') {
        // Sun should glow, use BasicMaterial
        material = new THREE.MeshBasicMaterial({ color: data.color });
        // Or potentially use an emissive StandardMaterial if textures are added later
        // material = new THREE.MeshStandardMaterial({ emissive: data.color, emissiveIntensity: 1 });
    } else {
        // Planets and moons react to light
        material = new THREE.MeshStandardMaterial({
            color: data.color,
            roughness: 0.9, // Less shiny
            metalness: 0.1
        });
    }
    const mesh = new THREE.Mesh(geometry, material);
    mesh.name = data.name;
    return mesh;
}

// Updated Helper function for rings to use Standard Material
function createRing(data) {
    const geometry = new THREE.RingGeometry(data.innerRadius, data.outerRadius, 64);
    const material = new THREE.MeshStandardMaterial({ // Changed to StandardMaterial
        color: data.color,
        side: THREE.DoubleSide,
        roughness: 0.9,
        metalness: 0.1,
        // opacity: 0.7, // Requires transparent: true
        // transparent: true
    });
    const mesh = new THREE.Mesh(geometry, material);
    mesh.name = data.name + " Ring";
    mesh.rotation.x = Math.PI / 2;
    return mesh;
}

// --- Create Solar System Objects ---
const solarSystemObjects = {
    sun: null,
    planets: [], // Will store { pivot: Object3D, mesh: Mesh, data: object, moons: [{ pivot: Object3D, mesh: Mesh, data: object }] }
};

// 1. Create Sun
solarSystemObjects.sun = createCelestialBody(celestialBodiesData.sun);
scene.add(solarSystemObjects.sun);

// 2. Create Planets and Moons
for (const planetKey in celestialBodiesData) {
    if (planetKey === 'sun') continue; // Skip sun, already created

    const planetData = celestialBodiesData[planetKey];

    // Create planet orbit pivot (orbits around the sun at 0,0,0)
    const planetOrbitPivot = new THREE.Object3D();
    scene.add(planetOrbitPivot);

    // Create planet mesh
    const planetMesh = createCelestialBody(planetData);
    planetMesh.position.x = planetData.distance; // Position relative to pivot
    planetOrbitPivot.add(planetMesh); // Add planet to its orbit pivot

    const planetInfo = {
        pivot: planetOrbitPivot,
        mesh: planetMesh,
        data: planetData,
        moons: []
    };

     // Add Rings if they exist
    if (planetData.rings) {
        const ringMesh = createRing(planetData.rings);
        // Tilt rings slightly (e.g., Saturn) - adjust as needed
        if (planetData.name === 'Saturn') {
             ringMesh.rotation.y = 0.1; // Example tilt
        } else if (planetData.name === 'Uranus') {
             // Uranus has significant axial tilt, often depicted with vertical rings
             // Keep rings in XZ plane relative to planet for simplicity now
             // A more accurate model would tilt the planet's entire system
             ringMesh.rotation.y = Math.PI / 2;
        }
        planetMesh.add(ringMesh); // Add rings as child of the planet mesh
    }


    // Create Moons for this planet
    if (planetData.moons) {
        planetData.moons.forEach(moonData => {
            // Create moon orbit pivot (orbits around the planet)
            const moonOrbitPivot = new THREE.Object3D();
            planetMesh.add(moonOrbitPivot); // Add moon pivot to the PLANET MESH

            // Create moon mesh
            const moonMesh = createCelestialBody(moonData);
            moonMesh.position.x = moonData.distance; // Position relative to moon pivot
            moonOrbitPivot.add(moonMesh); // Add moon mesh to its pivot

            planetInfo.moons.push({
                pivot: moonOrbitPivot,
                mesh: moonMesh,
                data: moonData
            });
        });
    }

    solarSystemObjects.planets.push(planetInfo);
}

console.log("Solar system objects created:", solarSystemObjects); // For debugging

// --- Add Orbit Paths ---
function createOrbitPath(radius, segments = 128) {
    const geometry = new THREE.BufferGeometry().setFromPoints(
        new THREE.Path().absarc(0, 0, radius, 0, Math.PI * 2, true).getPoints(segments)
    );
    const material = new THREE.LineBasicMaterial({ 
        color: 0x444444,
        transparent: true,
        opacity: 0.3,
        linewidth: 1 
    });
    return new THREE.Line(geometry, material);
}

// Add orbit paths for planets
solarSystemObjects.planets.forEach(planetInfo => {
    const orbitPath = createOrbitPath(planetInfo.data.distance);
    // Rotate to match the XZ plane
    orbitPath.rotation.x = Math.PI / 2;
    scene.add(orbitPath);
});


// Clock for animations
const clock = new THREE.Clock();


// 4. Animation Loop
function animate() {
    requestAnimationFrame(animate);
    const elapsedTime = clock.getElapsedTime();

    // Animate planets around the sun
    solarSystemObjects.planets.forEach(planetInfo => {
        if (planetInfo.data.period > 0) { // Avoid division by zero if period is missing
            const angle = (elapsedTime * timeScale / planetInfo.data.period) * 2 * Math.PI;
            planetInfo.pivot.rotation.y = angle;
        }

        // Animate moons around their planet
        planetInfo.moons.forEach(moonInfo => {
            if (moonInfo.data.period > 0) {
                const moonAngle = (elapsedTime * timeScale / moonInfo.data.period) * 2 * Math.PI * 10; // Moons orbit faster relative to planets typically, scale up
                moonInfo.pivot.rotation.y = moonAngle;
            }
            // Optional: Add moon self-rotation
            moonInfo.mesh.rotation.y += 0.01;
        });

        // Add planet self-rotation (axial spin)
        planetInfo.mesh.rotation.y += 0.005;
    });

    // Add Sun self-rotation
    solarSystemObjects.sun.rotation.y += 0.001;

    controls.update(); // Update controls (needed for damping)
    renderer.render(scene, camera);
}
// Note: Removed the extra animate() call from here


// 5. Handle Window Resize
window.addEventListener('resize', () => {
    // Update camera aspect ratio
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();

    // Update renderer size
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// --- Start the loop ---
animate(); // Start the loop here, after everything is set up

// Time slider control
const timeSlider = document.getElementById('timeSlider');
const timeValue = document.getElementById('timeValue');

// Set initial slider value to match the timeScale variable
timeSlider.value = timeScale * 50;
timeValue.textContent = `Current: ${timeScale.toFixed(2)}`;

timeSlider.addEventListener('input', function() {
    // Convert slider value (0-100) to a useful time scale (0-2)
    timeScale = this.value / 50;
    timeValue.textContent = `Current: ${timeScale.toFixed(2)}`;
});

// --- Asteroid Impact Feature ---
let asteroidAnimation = null;
let isAsteroidActive = false;

// Create asteroid object
function createAsteroid() {
    const geometry = new THREE.SphereGeometry(2, 32, 32);
    
    // Create a textured material for the asteroid
    const material = new THREE.MeshStandardMaterial({
        color: 0x8B4513,
        roughness: 0.9,
        metalness: 0.2,
        bumpScale: 0.5
    });
    
    const asteroid = new THREE.Mesh(geometry, material);
    
    // Make it irregular by distorting vertices
    const positions = asteroid.geometry.attributes.position;
    const vertices = [];
    
    for (let i = 0; i < positions.count; i++) {
        const x = positions.getX(i);
        const y = positions.getY(i);
        const z = positions.getZ(i);
        
        // Add random bumps
        const distortion = 0.2;
        positions.setXYZ(
            i,
            x + (Math.random() - 0.5) * distortion,
            y + (Math.random() - 0.5) * distortion,
            z + (Math.random() - 0.5) * distortion
        );
    }
    
    asteroid.geometry.computeVertexNormals();
    
    // Position the asteroid far away
    asteroid.position.set(-300, 100, -300);
    
    // Add a trail effect
    asteroid.userData.trail = createAsteroidTrail();
    scene.add(asteroid.userData.trail);
    
    return asteroid;
}

// Create particle trail for asteroid
function createAsteroidTrail() {
    const particleCount = 1000;
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);
    
    const trailGeometry = new THREE.BufferGeometry();
    trailGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    trailGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    
    const trailMaterial = new THREE.PointsMaterial({
        size: 1.2,
        sizeAttenuation: true,
        transparent: true,
        blending: THREE.AdditiveBlending,
        vertexColors: true,
        depthWrite: false
    });
    
    const trail = new THREE.Points(trailGeometry, trailMaterial);
    return trail;
}

// Update asteroid trail effect
function updateAsteroidTrail(asteroid, time) {
    if (!asteroid || !asteroid.userData.trail) return;
    
    const positions = asteroid.userData.trail.geometry.attributes.position;
    const colors = asteroid.userData.trail.geometry.attributes.color;
    
    // Shift positions back
    for (let i = positions.count - 1; i > 10; i--) {
        positions.setXYZ(
            i,
            positions.getX(i - 3),
            positions.getY(i - 3),
            positions.getZ(i - 3)
        );
        
        colors.setXYZ(
            i,
            colors.getX(i - 3) * 0.98,
            colors.getY(i - 3) * 0.98,
            colors.getZ(i - 3) * 0.98
        );
    }
    
    // Add new positions at the front
    for (let i = 0; i < 3; i++) {
        positions.setXYZ(
            i,
            asteroid.position.x + (Math.random() - 0.5) * 2,
            asteroid.position.y + (Math.random() - 0.5) * 2,
            asteroid.position.z + (Math.random() - 0.5) * 2
        );
        
        // Reddish-orange color for the trail
        colors.setXYZ(
            i,
            0.9 + Math.random() * 0.1, // Red
            0.5 + Math.random() * 0.3, // Green
            0.1 + Math.random() * 0.1  // Blue
        );
    }
    
    positions.needsUpdate = true;
    colors.needsUpdate = true;
}

// Create explosion effect
function createExplosion(position, size = 15) {
    const particleCount = 3000;
    const particles = new THREE.BufferGeometry();
    
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);
    const velocities = [];
    
    for (let i = 0; i < particleCount; i++) {
        // Random positions in a sphere
        const radius = Math.random() * size;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        
        positions[i * 3] = position.x + radius * Math.sin(phi) * Math.cos(theta);
        positions[i * 3 + 1] = position.y + radius * Math.sin(phi) * Math.sin(theta);
        positions[i * 3 + 2] = position.z + radius * Math.cos(phi);
        
        // Color based on position (inner is lighter/yellow, outer is red/orange)
        const distanceFromCenter = radius / size;
        
        if (distanceFromCenter < 0.3) {
            // Inner explosion - white/yellow
            colors[i * 3] = 1;
            colors[i * 3 + 1] = 1;
            colors[i * 3 + 2] = 0.8;
        } else if (distanceFromCenter < 0.7) {
            // Middle explosion - orange
            colors[i * 3] = 1;
            colors[i * 3 + 1] = 0.5 - distanceFromCenter * 0.5;
            colors[i * 3 + 2] = 0;
        } else {
            // Outer explosion - red/dark
            colors[i * 3] = 1 - (distanceFromCenter - 0.7) * 0.8;
            colors[i * 3 + 1] = 0.1;
            colors[i * 3 + 2] = 0;
        }
        
        // Store velocity for animation
        velocities.push({
            x: (Math.random() - 0.5) * 2,
            y: (Math.random() - 0.5) * 2,
            z: (Math.random() - 0.5) * 2,
            speed: 0.5 + Math.random() * 1.5
        });
    }
    
    particles.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    particles.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    
    const material = new THREE.PointsMaterial({
        size: 1.5,
        sizeAttenuation: true,
        transparent: true,
        opacity: 1,
        vertexColors: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
    });
    
    const explosion = new THREE.Points(particles, material);
    explosion.userData.velocities = velocities;
    explosion.userData.age = 0;
    explosion.userData.maxAge = 120;
    
    scene.add(explosion);
    return explosion;
}

// Update explosion animation
function updateExplosion(explosion) {
    if (!explosion) return false;
    
    explosion.userData.age++;
    
    if (explosion.userData.age > explosion.userData.maxAge) {
        scene.remove(explosion);
        return false;
    }
    
    const positions = explosion.geometry.attributes.position;
    const colors = explosion.geometry.attributes.color;
    const velocities = explosion.userData.velocities;
    
    const progress = explosion.userData.age / explosion.userData.maxAge;
    const fadeStart = 0.7;
    
    for (let i = 0; i < positions.count; i++) {
        // Update position based on velocity
        positions.setX(i, positions.getX(i) + velocities[i].x * velocities[i].speed);
        positions.setY(i, positions.getY(i) + velocities[i].y * velocities[i].speed);
        positions.setZ(i, positions.getZ(i) + velocities[i].z * velocities[i].speed);
        
        // Fade out particles as explosion ages
        if (progress > fadeStart) {
            const opacity = 1 - (progress - fadeStart) / (1 - fadeStart);
            colors.setW(i, opacity);
        }
    }
    
    positions.needsUpdate = true;
    colors.needsUpdate = true;
    
    // Reduce opacity of the whole explosion
    explosion.material.opacity = Math.max(0, 1 - progress);
    
    return true;
}

// Add flash effect
function createFlash(position, color = 0xFFFFFF, intensity = 10) {
    const light = new THREE.PointLight(color, intensity, 100);
    light.position.copy(position);
    scene.add(light);
    
    return light;
}

// Load sound effects
function loadSounds() {
    // Create an audio listener
    const listener = new THREE.AudioListener();
    camera.add(listener);
    
    // Global audio source
    const sound = new THREE.Audio(listener);
    
    // Load sound file
    const audioLoader = new THREE.AudioLoader();
    
    // Create audio elements (for browsers that need user interaction first)
    const approachSound = document.createElement('audio');
    approachSound.src = 'https://cdn.freesound.org/previews/536/536762_9015615-lq.mp3'; // Whoosh sound
    approachSound.volume = 0.5;
    
    const explosionSound = document.createElement('audio');
    explosionSound.src = 'https://cdn.freesound.org/previews/511/511506_9015615-lq.mp3'; // Explosion sound
    explosionSound.volume = 0.8;
    
    return {
        approach: approachSound,
        explosion: explosionSound
    };
}

// Asteroid animation sequence
function asteroidImpact() {
    if (isAsteroidActive) return;
    isAsteroidActive = true;
    
    const sounds = loadSounds();
    
    // Find Earth object
    const earthInfo = solarSystemObjects.planets.find(planet => planet.data.name === 'Earth');
    if (!earthInfo) {
        console.error("Earth not found in solar system objects");
        return;
    }
    
    // Create asteroid
    const asteroid = createAsteroid();
    scene.add(asteroid);
    
    // Initial camera position backup
    const initialCameraPosition = camera.position.clone();
    const initialControlsTarget = controls.target.clone();
    
    // Animation variables
    let step = 0;
    const totalSteps = 200;
    let explosion = null;
    let flash = null;
    
    // Clean up any previous animation
    if (asteroidAnimation) {
        cancelAnimationFrame(asteroidAnimation);
    }
    
    // Animation function
    function animate() {
        step++;
        
        // Update trail
        updateAsteroidTrail(asteroid, step / totalSteps);
        
        if (step < totalSteps) {
            // Calculate Earth's current position (accounting for its orbit)
            const earthWorldPosition = new THREE.Vector3();
            earthInfo.mesh.getWorldPosition(earthWorldPosition);
            
            // Move asteroid towards Earth
            const progress = step / totalSteps;
            asteroid.position.x += (earthWorldPosition.x - asteroid.position.x) * 0.03;
            asteroid.position.y += (earthWorldPosition.y - asteroid.position.y) * 0.03;
            asteroid.position.z += (earthWorldPosition.z - asteroid.position.z) * 0.03;
            
            // Rotate asteroid
            asteroid.rotation.x += 0.02;
            asteroid.rotation.y += 0.03;
            
            // Gradually move camera to watch the impact
            if (progress > 0.3) {
                // Move the camera to a good viewing angle
                const targetPosition = earthWorldPosition.clone().add(new THREE.Vector3(20, 15, 20));
                camera.position.lerp(targetPosition, 0.02);
                controls.target.lerp(earthWorldPosition, 0.02);
                controls.update();
            }
            
            // Play approach sound when asteroid is halfway there
            if (progress > 0.5 && progress < 0.51) {
                sounds.approach.play().catch(e => console.log("Audio playback error:", e));
            }
            
            asteroidAnimation = requestAnimationFrame(animate);
        } else {
            // Impact!
            const earthWorldPosition = new THREE.Vector3();
            earthInfo.mesh.getWorldPosition(earthWorldPosition);
            
            // Play explosion sound
            sounds.explosion.play().catch(e => console.log("Audio playback error:", e));
            
            // Create explosion effect
            explosion = createExplosion(earthWorldPosition, 8);
            
            // Create flash
            flash = createFlash(earthWorldPosition, 0xFFFFFF, 20);
            
            // Hide Earth (it's been destroyed!)
            earthInfo.mesh.visible = false;
            
            // Remove asteroid
            scene.remove(asteroid);
            if (asteroid.userData.trail) {
                scene.remove(asteroid.userData.trail);
            }
            
            // Continue with explosion animation
            function animateExplosion() {
                // Update explosion particles
                const isExplosionActive = explosion ? updateExplosion(explosion) : false;
                
                // Fade out flash
                if (flash) {
                    flash.intensity *= 0.95;
                    if (flash.intensity < 0.1) {
                        scene.remove(flash);
                        flash = null;
                    }
                }
                
                if (isExplosionActive || flash) {
                    asteroidAnimation = requestAnimationFrame(animateExplosion);
                } else {
                    // End of animation - reset
                    setTimeout(() => {
                        // Restore Earth
                        earthInfo.mesh.visible = true;
                        
                        // Reset camera to original position
                        camera.position.copy(initialCameraPosition);
                        controls.target.copy(initialControlsTarget);
                        controls.update();
                        
                        // Reset flag so the animation can be triggered again
                        isAsteroidActive = false;
                    }, 3000); // Wait 3 seconds before restoring earth
                }
            }
            
            // Start explosion animation
            animateExplosion();
        }
    }
    
    // Start asteroid animation
    animate();
}

// Add event listener to the button
document.getElementById('launchAsteroid').addEventListener('click', asteroidImpact);

    </script>
